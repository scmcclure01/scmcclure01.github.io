<h1>Home Assistant Nest</h1>
<p>Home Assistant Nest is a private, single-user app. It connects the owner's own Google Nest thermostat to the owner's own Home Assistant server at home, using Google's Smart Device Management API.</p>
<p>It is not a public service. No one else can sign up or use it.</p>
